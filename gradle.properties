# Dex merge (R8) + KSP are memory-heavy. If you still OOM, close other apps or lower workers.max to 1.
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
